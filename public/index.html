<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Журнал МЭШ</title>
    <style>
        :root {
            --t-blue: #0078d4;
            --t-bg: #f3f4f6;
            --t-border: #e5e7eb;
            --t-text: #1f2937;
            --t-gray: #6b7280;
            --t-g2: #ef4444;
            --t-g3: #f97316;
            --t-g4: #22c55e;
            --t-g5: #3b82f6;

            --s-bg: #1c1c1e;
            --s-card: #2c2c2e;
            --s-text: #ffffff;
            --s-gray: #8e8e93;
            --s-red: #ff3b30;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: var(--t-bg); color: var(--t-text); font-size: 14px; overflow: hidden; }

        .hidden { display: none !important; }

        /* ===== ОБЩИЕ КНОПКИ ===== */
        .btn { padding: 8px 16px; border-radius: 4px; cursor: pointer; border: none; font-weight: 500; font-size: 13px; }
        .btn-blue { background: var(--t-blue); color: white; }
        .btn-red { background: #fee2e2; color: #ef4444; }
        .btn-gray { background: var(--t-border); color: var(--t-text); }

        /* ===== ЭКРАН ВХОДА ===== */
        #loginScreen {
            position: fixed; inset: 0; background: #fff; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 1000; padding: 20px;
        }
        #loginScreen h2 { color: var(--t-blue); margin-bottom: 20px; font-size: 24px; }
        #loginScreen input {
            width: 100%; max-width: 300px; padding: 12px; margin: 5px 0;
            border: 1px solid var(--t-border); border-radius: 8px; font-size: 14px;
        }
        #loginScreen button {
            width: 100%; max-width: 300px; padding: 12px; margin-top: 15px;
            background: var(--t-blue); color: white; border: none; border-radius: 8px;
            font-size: 16px; font-weight: 600; cursor: pointer;
        }

        /* ===== МОДАЛЬНЫЕ ОКНА ===== */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 15px; }
        .modal-content { background: #fff; padding: 20px; border-radius: 12px; width: 100%; max-width: 450px; max-height: 90vh; overflow-y: auto; }
        .modal-content h3 { margin-bottom: 15px; font-size: 18px; }
        .modal-content label { display: block; margin-top: 12px; font-size: 12px; color: var(--t-gray); font-weight: 600; text-transform: uppercase; }
        .modal-content input, .modal-content select, .modal-content textarea {
            width: 100%; padding: 10px; margin-top: 5px; border: 1px solid var(--t-border); border-radius: 6px; font-size: 14px;
        }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: space-between; }
        
        .grades-btns { display: flex; gap: 10px; margin-top: 5px; align-items: center; }
        .grades-btns button {
            flex: 1; height: 45px; border: 1px solid var(--t-border); background: #fff;
            border-radius: 6px; cursor: pointer; font-size: 18px; font-weight: bold; color: var(--t-text);
        }
        .grades-btns button.active { background: var(--t-blue); color: white; border-color: var(--t-blue); }

        /* Переключатель точки */
        .toggle-group { display: flex; align-items: center; gap: 8px; margin-left: auto; background: #f3f4f6; padding: 5px 10px; border-radius: 20px; cursor: pointer; }
        .toggle { width: 36px; height: 20px; background: #ccc; border-radius: 10px; position: relative; transition: 0.2s; }
        .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; background: #fff; border-radius: 50%; transition: 0.2s; }
        .toggle.active { background: var(--t-blue); }
        .toggle.active::after { left: 18px; }

        /* ===== УЧИТЕЛЬ ===== */
        #teacherScreen { display: flex; height: 100vh; width: 100%; }
        .sidebar { width: 260px; background: #fff; border-right: 1px solid var(--t-border); padding: 20px; display: flex; flex-direction: column; }
        .sidebar h3 { color: var(--t-blue); margin-bottom: 20px; }
        .sidebar ul { list-style: none; }
        .sidebar li { padding: 10px; cursor: pointer; border-radius: 6px; color: var(--t-text); font-weight: 500; margin-bottom: 5px; }
        .sidebar li.active { background: #e5f0fa; color: var(--t-blue); }
        .sidebar .logout { margin-top: auto; background: #fee2e2; color: #ef4444; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: 600; }

        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header { background: #fff; padding: 15px 20px; border-bottom: 1px solid var(--t-border); display: flex; justify-content: space-between; align-items: center; }
        .header .title { font-size: 18px; font-weight: 700; color: var(--t-blue); }
        .controls { display: flex; gap: 10px; align-items: center; }

        .subjects { background: #fff; padding: 10px 20px; border-bottom: 1px solid var(--t-border); display: flex; gap: 10px; overflow-x: auto; }
        .subjects::-webkit-scrollbar { display: none; }
        .subject-btn { padding: 6px 16px; border: 1px solid var(--t-border); background: #fff; border-radius: 20px; cursor: pointer; white-space: nowrap; font-size: 13px; font-weight: 500; color: var(--t-text); }
        .subject-btn.active { background: var(--t-blue); color: white; border-color: var(--t-blue); }

        .content-area { flex: 1; overflow: auto; padding: 20px; }

        /* Таблица */
        .desktop-table { display: block; width: 100%; }
        table { width: 100%; border-collapse: collapse; background: #fff; min-width: 800px; }
        th, td { border: 1px solid var(--t-border); padding: 12px; text-align: center; }
        th { background: #f9fafb; font-weight: 600; }
        .date-th { cursor: pointer; color: var(--t-blue); text-decoration: underline; }
        .date-th:hover { background: #e5f0fa; }
        .student-name { text-align: left; font-weight: 600; }
        .cell { cursor: pointer; font-weight: bold; font-size: 16px; position: relative; }
        .cell:hover { background: #e5f0fa; }
        .g2 { color: var(--t-g2); } .g3 { color: var(--t-g3); } .g4 { color: var(--t-g4); } .g5 { color: var(--t-g5); }
        
        .dot-mark { font-size: 12px; color: #666; font-style: italic; display: block; margin-top: 2px; }

        /* Мобильный список */
        .mobile-list { display: none; flex-direction: column; gap: 10px; }
        .mobile-card { background: #fff; padding: 15px; border-radius: 8px; border: 1px solid var(--t-border); display: flex; justify-content: space-between; align-items: center; }
        .mobile-card .name { font-weight: 600; font-size: 15px; }
        .mobile-card .grades-preview { display: flex; gap: 5px; margin-top: 5px; }
        .mobile-card .grade-preview-item { width: 24px; height: 24px; border-radius: 4px; background: var(--t-bg); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; }

        /* ===== УЧЕНИК ===== */
        #studentScreen {
            display: flex; flex-direction: column; background: var(--s-bg); color: var(--s-text);
            height: 100vh; width: 100%; max-width: 600px; margin: 0 auto; position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }
        
        .s-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .s-content { flex: 1; overflow-y: auto; padding-bottom: 80px; }
        
        .s-card { background: var(--s-card); margin: 0 15px 15px 15px; padding: 15px; border-radius: 16px; display: flex; justify-content: space-between; align-items: flex-start; }
        .s-card-title { font-size: 17px; font-weight: 600; margin-bottom: 5px; }
        .s-card-hw { font-size: 13px; color: var(--s-gray); line-height: 1.4; }
        
        .s-grades-container { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 50%; }
        
        .s-grade { 
            width: 42px; height: 42px; background: #3a3a3c; border-radius: 10px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            font-weight: 700; font-size: 16px; cursor: pointer;
            border: 2px solid transparent; position: relative;
        }
        .s-grade.g5 { color: #34c759; }
        .s-grade.g4 { color: #ff9500; }
        .s-grade.g3 { color: #ff3b30; }
        
        /* Красный контур для контрольной */
        .s-grade.test-grade { border-color: #ff3b30; background: rgba(255, 59, 48, 0.15); }

        /* Точка у ученика */
        .s-grade .dot-indicator { font-size: 18px; line-height: 1; margin-bottom: -2px; }
        .s-grade .date-indicator { font-size: 9px; color: #8e8e93; line-height: 1; margin-top: 2px; }

        .s-bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; background: #1a1a1a; display: flex; justify-content: space-around; padding: 15px 0 25px 0; border-top: 1px solid #333; }
        .s-nav-btn { background: none; border: none; color: var(--s-gray); font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .s-nav-btn.active { color: white; }
        .s-nav-icon { font-size: 20px; }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 768px) {
            #teacherScreen .sidebar { display: none; }
            .header { padding: 10px 15px; flex-direction: column; align-items: flex-start; gap: 10px; }
            .controls { width: 100%; justify-content: space-between; }
            .content-area { padding: 10px; }
            .desktop-table { display: none; }
            .mobile-list { display: flex; }
            #studentScreen { max-width: 100%; box-shadow: none; }
        }
    </style>
</head>
<body>

    <!-- ВХОД -->
    <div id="loginScreen" class="hidden">
        <h2>Журнал МЭШ</h2>
        <div id="loginError" style="color: red; font-size: 13px; margin-bottom: 10px; text-align: center;"></div>
        <input type="text" id="loginInput" placeholder="Логин">
        <input type="password" id="passwordInput" placeholder="Пароль">
        <button onclick="doLogin()">Войти</button>
    </div>

    <!-- УЧИТЕЛЬ -->
    <div id="teacherScreen" class="hidden">
        <div class="sidebar">
            <h3>Кабинет учителя</h3>
            <ul>
                <li>📊 Расписание</li>
                <li class="active">📖 Журнал 5В</li>
                <li>📝 Задания</li>
            </ul>
            <button class="logout" onclick="doLogout()">Выйти</button>
        </div>
        <div class="main">
            <div class="header">
                <div class="title">Журнал 5В</div>
                <div class="controls">
                    <button class="btn btn-blue" onclick="openHwModal()">Изменить общее ДЗ</button>
                    <button class="btn btn-red" onclick="doLogout()">Выйти</button>
                </div>
            </div>
            <div class="subjects" id="subjectsBar"></div>
            
            <div class="content-area">
                <div class="desktop-table">
                    <table>
                        <thead id="tableHead"></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
                <div class="mobile-list" id="mobileList"></div>
            </div>
        </div>
    </div>

    <!-- УЧЕНИК -->
    <div id="studentScreen" class="hidden">
        <div class="s-header">
            <h3>Мой профиль</h3>
            <button class="btn btn-red" onclick="doLogout()" style="background: #3a3a3c; color: white; border: none; padding: 8px 16px; border-radius: 8px;">Выйти</button>
        </div>
        <div class="s-content" id="studentContent"></div>
        <div class="s-bottom-nav">
            <button class="s-nav-btn active" onclick="switchStudentTab('schedule')">
                <span class="s-nav-icon">📅</span>Расписание
            </button>
            <button class="s-nav-btn" onclick="switchStudentTab('grades')">
                <span class="s-nav-icon">⭐</span>Оценки
            </button>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ОЦЕНКИ -->
    <div id="gradeModal" class="modal hidden">
        <div class="modal-content">
            <h3 id="modalTitle">Выставление оценки</h3>
            
            <label>За что?</label>
            <select id="inputType">
                <option>Ответ на уроке</option>
                <option>Контрольная работа</option>
                <option>Самостоятельная работа</option>
                <option>Домашнее задание</option>
                <option>Тест</option>
            </select>
            
            <label>Оценка</label>
            <div class="grades-btns">
                <button type="button" onclick="selectGrade(5)">5</button>
                <button type="button" onclick="selectGrade(4)">4</button>
                <button type="button" onclick="selectGrade(3)">3</button>
                <button type="button" onclick="selectGrade(2)">2</button>
                
                <!-- ПЕРЕКЛЮЧАТЕЛЬ ТОЧКИ -->
                <div class="toggle-group" onclick="toggleDot()">
                    <span style="font-size:12px; font-weight:bold;">Точка</span>
                    <div class="toggle" id="dotToggle"></div>
                </div>
            </div>

            <label id="dateLabel" style="display: none;">Исправить до</label>
            <input type="date" id="inputDate" style="display: none;">
            
            <label>Тема</label>
            <input type="text" id="inputTheme" placeholder="Тема урока">
            
            <label>Комментарий</label>
            <input type="text" id="inputComment" placeholder="Комментарий">
            
            <div class="modal-actions" style="justify-content: space-between;">
                <button class="btn btn-red" id="btnDelete" onclick="deleteGrade()" style="display: none;">Удалить</button>
                <div style="display: flex; gap: 10px; margin-left: auto;">
                    <button class="btn btn-gray" onclick="closeModal('gradeModal')">Отмена</button>
                    <button class="btn btn-blue" onclick="saveGrade()">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ДАТЫ -->
    <div id="dateModal" class="modal hidden">
        <div class="modal-content">
            <h3 id="dateModalTitle">Настройки дня</h3>
            
            <label>Домашнее задание на этот день</label>
            <textarea id="dateHwInput" rows="3" placeholder="Введите ДЗ..."></textarea>
            
            <label style="margin-top: 20px; border-top: 1px solid #ddd; padding-top: 15px;">Контрольная работа</label>
            <div style="display: flex; gap: 10px; align-items: center; margin-top: 10px;">
                <input type="checkbox" id="isTestCheckbox" style="width: 18px; height: 18px;">
                <span style="font-size: 14px;">Назначить контрольную</span>
            </div>
            <input type="text" id="dateTestTheme" placeholder="Тема контрольной" style="display: none; margin-top: 10px;">
            
            <div class="modal-actions">
                <button class="btn btn-gray" onclick="closeModal('dateModal')">Отмена</button>
                <button class="btn btn-blue" onclick="saveDateSettings()">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ОБЩЕГО ДЗ -->
    <div id="hwModal" class="modal hidden">
        <div class="modal-content">
            <h3>Домашнее задание (Общее)</h3>
            <textarea id="hwInput" rows="4"></textarea>
            <div class="modal-actions">
                <button class="btn btn-gray" onclick="closeModal('hwModal')">Отмена</button>
                <button class="btn btn-blue" onclick="saveHw()">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        // --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ---
        let currentUser = null;
        let appData = null;
        let currentSubject = "Математика";
        let activeCell = { studentId: null, date: null };
        let activeDate = null;
        let selectedGrade = null;
        let isDotSelected = false;

        // --- АВТОМАТИЧЕСКИЙ ВХОД (ПРОВЕРКА LOCALSTORAGE) ---
        document.addEventListener('DOMContentLoaded', async () => {
            const savedUser = localStorage.getItem('mesh_user');
            if (savedUser) {
                try {
                    currentUser = JSON.parse(savedUser);
                    await loadAppData();
                } catch (e) {
                    localStorage.removeItem('mesh_user');
                    showLoginScreen();
                }
            } else {
                showLoginScreen();
            }
        });

        function showLoginScreen() {
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('teacherScreen').classList.add('hidden');
            document.getElementById('studentScreen').classList.add('hidden');
        }

        // --- АВТОРИЗАЦИЯ ---
        async function doLogin() {
            const login = document.getElementById('loginInput').value;
            const pass = document.getElementById('passwordInput').value;
            const errorDiv = document.getElementById('loginError');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, password: pass })
                });
                const data = await res.json();

                if (res.ok) {
                    currentUser = data;
                    // СОХРАНЯЕМ СЕССИЮ
                    localStorage.setItem('mesh_user', JSON.stringify(data));
                    errorDiv.innerText = "";
                    document.getElementById('loginScreen').classList.add('hidden');
                    await loadAppData();
                } else {
                    errorDiv.innerText = data.error;
                }
            } catch (e) {
                errorDiv.innerText = "Ошибка сервера";
            }
        }

        function doLogout() {
            localStorage.removeItem('mesh_user');
            location.reload();
        }

        // --- ЗАГРУЗКА ДАННЫХ ---
        async function loadAppData() {
            const url = currentUser.role === 'student' 
                ? `/api/data?role=student&studentId=${currentUser.id}` 
                : '/api/data';
            const res = await fetch(url);
            appData = await res.json();

            if (currentUser.role === 'teacher') {
                document.getElementById('teacherScreen').classList.remove('hidden');
                renderTeacherUI();
            } else {
                document.getElementById('studentScreen').classList.remove('hidden');
                switchStudentTab('schedule');
            }
        }

        // --- ИНТЕРФЕЙС УЧИТЕЛЯ ---
        function renderTeacherUI() {
            const subBar = document.getElementById('subjectsBar');
            subBar.innerHTML = '';
            Object.keys(appData.subjects).forEach(subj => {
                const btn = document.createElement('button');
                btn.className = `subject-btn ${subj === currentSubject ? 'active' : ''}`;
                btn.innerText = subj;
                btn.onclick = () => { currentSubject = subj; renderTeacherUI(); };
                subBar.appendChild(btn);
            });

            const thead = document.getElementById('tableHead');
            thead.innerHTML = `<tr><th style="text-align:left;">Ученик</th>`;
            appData.dates.forEach(d => {
                thead.innerHTML += `<th class="date-th" onclick="openDateModal('${d}')">${d}</th>`;
            });
            thead.innerHTML += `</tr>`;

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            const mobileList = document.getElementById('mobileList');
            mobileList.innerHTML = '';

            appData.students.forEach(student => {
                // Таблица ПК
                const tr = document.createElement('tr');
                tr.innerHTML = `<td class="student-name">${student.name}</td>`;
                
                appData.dates.forEach(date => {
                    const td = document.createElement('td');
                    td.className = 'cell';
                    const key = `${student.id}-${date}`;
                    const gradeData = appData.subjects[currentSubject].grades[key];

                    if (gradeData) {
                        if (gradeData.isDot) {
                            // Отображение точки (маленькая оценка с датой)
                            td.innerHTML = `<span class="g${gradeData.grade}">${gradeData.grade}.</span> <span class="dot-mark">до ${gradeData.dueDate || '...'}</span>`;
                        } else {
                            td.innerText = gradeData.grade;
                            td.classList.add(`g${gradeData.grade}`);
                        }
                    }

                    td.onclick = function() { openGradeModal(student, date); };
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);

                // Карточка Телефон
                const card = document.createElement('div');
                card.className = 'mobile-card';
                
                let gradesHtml = '';
                appData.dates.forEach(date => {
                    const key = `${student.id}-${date}`;
                    if (appData.subjects[currentSubject].grades[key]) {
                        const g = appData.subjects[currentSubject].grades[key].grade;
                        const isDot = appData.subjects[currentSubject].grades[key].isDot;
                        gradesHtml += `<div class="grade-preview-item g${g}">${g}${isDot ? '.' : ''}</div>`;
                    }
                });

                card.innerHTML = `
                    <div>
                        <div class="name">${student.name}</div>
                        <div class="grades-preview">${gradesHtml || '<span style="font-size:12px;color:#999;">Нет оценок</span>'}</div>
                    </div>
                    <button class="btn btn-blue" onclick="openGradeModalForMobile(${student.id})">Оценить</button>
                `;
                mobileList.appendChild(card);
            });
        }

        function openGradeModalForMobile(studentId) {
            const student = appData.students.find(s => s.id === studentId);
            openGradeModal(student, appData.dates[0]);
        }

        function openGradeModal(student, date) {
            activeCell = { studentId: student.id, date: date };
            const key = `${student.id}-${date}`;
            const gradeData = appData.subjects[currentSubject].grades[key];
            
            selectedGrade = gradeData ? gradeData.grade : null;
            isDotSelected = gradeData ? (gradeData.isDot || false) : false;
            
            document.getElementById('modalTitle').innerText = `${student.name} — ${date}`;
            document.getElementById('inputType').value = gradeData ? gradeData.type : 'Ответ на уроке';
            document.getElementById('inputTheme').value = gradeData ? (gradeData.theme || '') : '';
            document.getElementById('inputComment').value = gradeData ? (gradeData.comment || '') : '';
            
            document.querySelectorAll('.grades-btns button').forEach(b => {
                b.classList.remove('active');
                if (b.innerText == selectedGrade) b.classList.add('active');
            });

            // Настройка точки
            const dotToggle = document.getElementById('dotToggle');
            if (isDotSelected) dotToggle.classList.add('active');
            else dotToggle.classList.remove('active');

            // Настройка даты исправления
            const dateLabel = document.getElementById('dateLabel');
            const dateInput = document.getElementById('inputDate');
            
            if (isDotSelected) {
                dateLabel.style.display = 'block';
                dateInput.style.display = 'block';
                dateInput.value = gradeData && gradeData.dueDate ? gradeData.dueDate : '';
            } else {
                dateLabel.style.display = 'none';
                dateInput.style.display = 'none';
            }

            document.getElementById('btnDelete').style.display = gradeData ? 'block' : 'none';
            document.getElementById('gradeModal').classList.remove('hidden');
        }

        function selectGrade(g) {
            selectedGrade = g;
            document.querySelectorAll('.grades-btns button').forEach(b => {
                b.classList.remove('active');
                if (b.innerText == g) b.classList.add('active');
            });
        }

        function toggleDot() {
            isDotSelected = !isDotSelected;
            const dotToggle = document.getElementById('dotToggle');
            const dateLabel = document.getElementById('dateLabel');
            const dateInput = document.getElementById('inputDate');
            
            if (isDotSelected) {
                dotToggle.classList.add('active');
                dateLabel.style.display = 'block';
                dateInput.style.display = 'block';
            } else {
                dotToggle.classList.remove('active');
                dateLabel.style.display = 'none';
                dateInput.style.display = 'none';
            }
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        async function saveGrade() {
            if (!selectedGrade) return alert("Выберите оценку!");

            const dueDate = isDotSelected ? document.getElementById('inputDate').value : null;

            await fetch('/api/grade', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    role: currentUser.role,
                    subject: currentSubject,
                    studentId: activeCell.studentId,
                    date: activeCell.date,
                    grade: selectedGrade,
                    type: document.getElementById('inputType').value,
                    theme: document.getElementById('inputTheme').value,
                    comment: document.getElementById('inputComment').value,
                    isDot: isDotSelected,
                    dueDate: dueDate
                })
            });

            closeModal('gradeModal');
            await loadAppData();
        }

        async function deleteGrade() {
            if (!confirm('Удалить эту оценку?')) return;
            await fetch('/api/grade', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    role: currentUser.role,
                    subject: currentSubject,
                    studentId: activeCell.studentId,
                    date: activeCell.date,
                    grade: null
                })
            });
            closeModal('gradeModal');
            await loadAppData();
        }

        // --- НАСТРОЙКА ДНЯ ---
        function openDateModal(date) {
            activeDate = date;
            document.getElementById('dateModalTitle').innerText = `Настройки на ${date}`;
            document.getElementById('dateHwInput').value = appData.subjects[currentSubject].homework || '';
            
            const tests = appData.subjects[currentSubject].tests || [];
            const hasTest = tests.find(t => t.date === date);
            
            document.getElementById('isTestCheckbox').checked = !!hasTest;
            document.getElementById('dateTestTheme').value = hasTest ? hasTest.theme : '';
            document.getElementById('dateTestTheme').style.display = hasTest ? 'block' : 'none';

            document.getElementById('dateModal').classList.remove('hidden');
        }

        document.getElementById('isTestCheckbox').addEventListener('change', function() {
            document.getElementById('dateTestTheme').style.display = this.checked ? 'block' : 'none';
        });

        async function saveDateSettings() {
            const hwText = document.getElementById('dateHwInput').value;
            const isTest = document.getElementById('isTestCheckbox').checked;
            const testTheme = document.getElementById('dateTestTheme').value;

            await fetch('/api/homework', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ role: currentUser.role, subject: currentSubject, text: hwText })
            });

            if (isTest && testTheme) {
                await fetch('/api/test', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ role: currentUser.role, subject: currentSubject, date: activeDate, theme: testTheme, action: 'add' })
                });
            } else if (!isTest) {
                await fetch('/api/test', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ role: currentUser.role, subject: currentSubject, date: activeDate, action: 'remove' })
                });
            }

            closeModal('dateModal');
            await loadAppData();
        }

        function openHwModal() {
            document.getElementById('hwInput').value = appData.subjects[currentSubject].homework || '';
            document.getElementById('hwModal').classList.remove('hidden');
        }

        async function saveHw() {
            await fetch('/api/homework', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ role: currentUser.role, subject: currentSubject, text: document.getElementById('hwInput').value })
            });
            closeModal('hwModal');
            await loadAppData();
        }

        // --- ИНТЕРФЕЙС УЧЕНИКА ---
        function switchStudentTab(tab) {
            document.querySelectorAll('.s-nav-btn').forEach(b => b.classList.remove('active'));
            if(tab === 'schedule') document.querySelectorAll('.s-nav-btn')[0].classList.add('active');
            if(tab === 'grades') document.querySelectorAll('.s-nav-btn')[1].classList.add('active');

            const container = document.getElementById('studentContent');
            container.innerHTML = '';

            if (tab === 'schedule') {
                Object.keys(appData.subjects).forEach(subj => {
                    const subjData = appData.subjects[subj];
                    const div = document.createElement('div');
                    div.className = 's-card';
                    
                    let gradesHtml = '';
                    const tests = subjData.tests || [];

                    appData.dates.forEach(d => {
                        const key = `${currentUser.id}-${d}`;
                        if (subjData.grades[key]) {
                            const gradeItem = subjData.grades[key];
                            const g = gradeItem.grade;
                            const isDot = gradeItem.isDot;
                            
                            const isTestGrade = gradeItem.type === 'Контрольная работа' || tests.some(t => t.date === d);
                            const testClass = isTestGrade ? 'test-grade' : '';
                            const dotClass = isDot ? 'dot-indicator' : '';
                            
                            let innerHtml = `${g}${isDot ? '.' : ''}`;
                            if (isDot && gradeItem.dueDate) {
                                innerHtml += `<span class="date-indicator">до ${gradeItem.dueDate}</span>`;
                            }

                            gradesHtml += `<div class="s-grade g${g} ${testClass}" onclick="alert('Оценка: ${g}\\nЗа что: ${gradeItem.type}\\nТема: ${gradeItem.theme || 'Не указана'}')">
                                <span class="${dotClass}">${innerHtml}</span>
                            </div>`;
                        }
                    });

                    div.innerHTML = `
                        <div style="max-width: 60%;">
                            <div class="s-card-title">${subj}</div>
                            <div class="s-card-hw">ДЗ: ${subjData.homework || 'Нет'}</div>
                        </div>
                        <div class="s-grades-container">${gradesHtml}</div>
                    `;
                    container.appendChild(div);
                });
            } else if (tab === 'grades') {
                container.innerHTML = '<div style="padding: 40px 20px; text-align: center; color: #8e8e93;">Все ваши оценки отображаются в разделе "Расписание"</div>';
            }
        }
    </script>
</body>
</html>
