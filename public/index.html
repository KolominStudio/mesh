<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Журнал МЭШ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f3f4f6; color: #1f2937; }

        /* Общие стили */
        .hidden { display: none !important; }
        .btn { padding: 8px 16px; border-radius: 4px; cursor: pointer; border: none; font-weight: bold; }
        .btn-blue { background: #0078d4; color: white; }
        .btn-red { background: #ef4444; color: white; }
        .btn-gray { background: #e5e7eb; color: #333; }

        /* Окно входа */
        #loginScreen { position: fixed; inset: 0; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; }
        #loginScreen input { padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; width: 250px; }
        #loginScreen button { padding: 10px; width: 250px; background: #0078d4; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }

        /* Модальное окно */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; }
        .modal-content h3 { margin-bottom: 15px; }
        .modal-content label { display: block; margin-top: 10px; font-size: 12px; color: #666; }
        .modal-content input, .modal-content select, .modal-content textarea { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
        .grades-btns { display: flex; gap: 10px; margin-top: 5px; }
        .grades-btns button { width: 40px; height: 40px; border: 1px solid #ccc; background: white; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .grades-btns button.active { background: #0078d4; color: white; border-color: #0078d4; }

        /* Интерфейс учителя */
        .teacher-layout { display: flex; height: 100vh; }
        .sidebar { width: 250px; background: white; border-right: 1px solid #ddd; padding: 20px; display: flex; flex-direction: column; }
        .sidebar ul { list-style: none; margin-top: 20px; }
        .sidebar li { padding: 10px; cursor: pointer; border-radius: 5px; color: #555; }
        .sidebar li.active { background: #e5f0fa; color: #0078d4; font-weight: bold; }
        .sidebar .logout { margin-top: auto; background: #fee2e2; color: #ef4444; border: none; padding: 10px; border-radius: 5px; cursor: pointer; }
        
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header { background: white; padding: 15px 20px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        .subjects { background: white; padding: 10px 20px; border-bottom: 1px solid #ddd; display: flex; gap: 10px; overflow-x: auto; }
        .subject-btn { padding: 5px 15px; border: 1px solid #ddd; background: white; border-radius: 20px; cursor: pointer; white-space: nowrap; }
        .subject-btn.active { background: #0078d4; color: white; border-color: #0078d4; }
        
        .table-container { flex: 1; overflow: auto; padding: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; min-width: 800px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #f9fafb; font-weight: bold; }
        .student-name { text-align: left; font-weight: bold; }
        .cell { cursor: pointer; font-weight: bold; font-size: 16px; }
        .cell:hover { background: #e5f0fa; }
        
        .g2 { color: #ef4444; } .g3 { color: #f97316; } .g4 { color: #22c55e; } .g5 { color: #3b82f6; }

        /* Интерфейс ученика (тёмный) */
        .student-layout { background: #1c1c1e; color: white; min-height: 100vh; padding-bottom: 70px; }
        .s-header { padding: 20px; display: flex; justify-content: space-between; }
        .s-card { background: #2c2c2e; margin: 15px; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; }
        .s-grade { width: 40px; height: 40px; background: #3a3a3c; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; cursor: pointer; }
        .s-bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #1a1a1a; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #333; }
        .s-nav-btn { background: none; border: none; color: #8e8e93; font-size: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .s-nav-btn.active { color: white; }
    </style>
</head>
<body>

    <!-- ЭКРАН ВХОДА -->
    <div id="loginScreen">
        <h2 style="color: #0078d4; margin-bottom: 20px;">Журнал МЭШ</h2>
        <div id="loginError" style="color: red; font-size: 12px; margin-bottom: 10px;"></div>
        <input type="text" id="loginInput" placeholder="Логин">
        <input type="password" id="passwordInput" placeholder="Пароль">
        <button onclick="doLogin()">Войти</button>
    </div>

    <!-- ИНТЕРФЕЙС УЧИТЕЛЯ -->
    <div id="teacherScreen" class="teacher-layout hidden">
        <div class="sidebar">
            <h3 style="color: #0078d4;">Кабинет учителя</h3>
            <ul>
                <li>📊 Расписание</li>
                <li class="active">📖 Журнал 5В</li>
                <li>📝 Задания</li>
            </ul>
            <button class="logout" onclick="doLogout()">Выйти</button>
        </div>
        <div class="main">
            <div class="header">
                <h3>Журнал 5В</h3>
                <div>
                    <button class="btn btn-blue" onclick="openHwModal()">Изменить ДЗ</button>
                    <button class="btn btn-red" onclick="doLogout()">Выйти</button>
                </div>
            </div>
            <div class="subjects" id="subjectsBar"></div>
            <div class="table-container">
                <table>
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ИНТЕРФЕЙС УЧЕНИКА -->
    <div id="studentScreen" class="student-layout hidden">
        <div class="s-header">
            <h3>Мой профиль</h3>
            <button class="btn btn-red" onclick="doLogout()">Выйти</button>
        </div>
        <div id="studentContent"></div>
        <div class="s-bottom-nav">
            <button class="s-nav-btn active" onclick="switchStudentTab('schedule')">📅<br>Расписание</button>
            <button class="s-nav-btn" onclick="switchStudentTab('grades')">⭐<br>Оценки</button>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ОЦЕНКИ -->
    <div id="gradeModal" class="modal hidden">
        <div class="modal-content">
            <h3 id="modalTitle">Выставление оценки</h3>
            <label>За что?</label>
            <select id="inputType">
                <option>Ответ на уроке</option>
                <option>Контрольная работа</option>
                <option>Домашнее задание</option>
                <option>Тест</option>
            </select>
            
            <label>Оценка</label>
            <div class="grades-btns">
                <button type="button" onclick="selectGrade(5)">5</button>
                <button type="button" onclick="selectGrade(4)">4</button>
                <button type="button" onclick="selectGrade(3)">3</button>
                <button type="button" onclick="selectGrade(2)">2</button>
            </div>

            <label>Тема</label>
            <input type="text" id="inputTheme" placeholder="Тема урока">
            
            <label>Комментарий</label>
            <input type="text" id="inputComment" placeholder="Комментарий">
            
            <div class="modal-actions">
                <button class="btn btn-gray" onclick="closeModal()">Отмена</button>
                <button class="btn btn-blue" onclick="saveGrade()">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ДЗ -->
    <div id="hwModal" class="modal hidden">
        <div class="modal-content">
            <h3>Домашнее задание</h3>
            <textarea id="hwInput" rows="4"></textarea>
            <div class="modal-actions">
                <button class="btn btn-gray" onclick="closeHwModal()">Отмена</button>
                <button class="btn btn-blue" onclick="saveHw()">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        // --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ---
        let currentUser = null;
        let appData = null;
        let currentSubject = "Математика";
        let activeCell = { studentId: null, date: null };
        let selectedGrade = null;

        // --- 1. АВТОРИЗАЦИЯ ---
        async function doLogin() {
            const login = document.getElementById('loginInput').value;
            const pass = document.getElementById('passwordInput').value;
            const errorDiv = document.getElementById('loginError');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, password: pass })
                });
                const data = await res.json();

                if (res.ok) {
                    currentUser = data;
                    errorDiv.innerText = "";
                    await loadAppData();
                } else {
                    errorDiv.innerText = data.error;
                }
            } catch (e) {
                errorDiv.innerText = "Ошибка сервера";
            }
        }

        function doLogout() {
            location.reload();
        }

        // --- 2. ЗАГРУЗКА ДАННЫХ ---
        async function loadAppData() {
            const url = currentUser.role === 'student' 
                ? `/api/data?role=student&studentId=${currentUser.id}` 
                : '/api/data';
                
            const res = await fetch(url);
            appData = await res.json();

            document.getElementById('loginScreen').classList.add('hidden');
            
            if (currentUser.role === 'teacher') {
                document.getElementById('teacherScreen').classList.remove('hidden');
                renderTeacherUI();
            } else {
                document.getElementById('studentScreen').classList.remove('hidden');
                switchStudentTab('schedule');
            }
        }

        // --- 3. ЛОГИКА УЧИТЕЛЯ ---
        function renderTeacherUI() {
            const subBar = document.getElementById('subjectsBar');
            subBar.innerHTML = '';
            Object.keys(appData.subjects).forEach(subj => {
                const btn = document.createElement('button');
                btn.className = `subject-btn ${subj === currentSubject ? 'active' : ''}`;
                btn.innerText = subj;
                btn.onclick = () => {
                    currentSubject = subj;
                    renderTeacherUI();
                };
                subBar.appendChild(btn);
            });

            const thead = document.getElementById('tableHead');
            thead.innerHTML = `<tr><th>Ученик</th>`;
            appData.dates.forEach(d => thead.innerHTML += `<th>${d}</th>`);
            thead.innerHTML += `</tr>`;

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            appData.students.forEach(student => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td class="student-name">${student.name}</td>`;
                
                appData.dates.forEach(date => {
                    const td = document.createElement('td');
                    td.className = 'cell';
                    const key = `${student.id}-${date}`;
                    const gradeData = appData.subjects[currentSubject].grades[key];

                    if (gradeData) {
                        td.innerText = gradeData.grade;
                        td.classList.add(`g${gradeData.grade}`);
                    }

                    // Открытие окна при клике
                    td.onclick = function() {
                        activeCell = { studentId: student.id, date: date };
                        selectedGrade = gradeData ? gradeData.grade : null;
                        
                        document.getElementById('modalTitle').innerText = `${student.name} — ${date}`;
                        document.getElementById('inputType').value = gradeData ? gradeData.type : 'Ответ на уроке';
                        document.getElementById('inputTheme').value = gradeData ? (gradeData.theme || '') : '';
                        document.getElementById('inputComment').value = gradeData ? (gradeData.comment || '') : '';
                        
                        // Подсветка кнопок
                        document.querySelectorAll('.grades-btns button').forEach(b => {
                            b.classList.remove('active');
                            if (b.innerText == selectedGrade) b.classList.add('active');
                        });

                        document.getElementById('gradeModal').classList.remove('hidden');
                    };
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }

        // --- 4. МОДАЛЬНОЕ ОКНО ОЦЕНКИ ---
        function selectGrade(g) {
            selectedGrade = g;
            document.querySelectorAll('.grades-btns button').forEach(b => {
                b.classList.remove('active');
                if (b.innerText == g) b.classList.add('active');
            });
        }

        function closeModal() {
            document.getElementById('gradeModal').classList.add('hidden');
        }

        async function saveGrade() {
            if (!selectedGrade) return alert("Выберите оценку!");

            const payload = {
                role: currentUser.role,
                subject: currentSubject,
                studentId: activeCell.studentId,
                date: activeCell.date,
                grade: selectedGrade,
                type: document.getElementById('inputType').value,
                theme: document.getElementById('inputTheme').value,
                comment: document.getElementById('inputComment').value
            };

            await fetch('/api/grade', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            closeModal();
            await loadAppData(); // Перезагружаем данные, чтобы оценка появилась
        }

        // --- 5. ДОМАШНЕЕ ЗАДАНИЕ ---
        function openHwModal() {
            document.getElementById('hwInput').value = appData.subjects[currentSubject].homework || '';
            document.getElementById('hwModal').classList.remove('hidden');
        }

        function closeHwModal() {
            document.getElementById('hwModal').classList.add('hidden');
        }

        async function saveHw() {
            await fetch('/api/homework', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    subject: currentSubject,
                    text: document.getElementById('hwInput').value
                })
            });
            closeHwModal();
            await loadAppData();
        }

        // --- 6. ЛОГИКА УЧЕНИКА ---
        function switchStudentTab(tab) {
            document.querySelectorAll('.s-nav-btn').forEach(b => b.classList.remove('active'));
            if(tab === 'schedule') document.querySelectorAll('.s-nav-btn')[0].classList.add('active');
            if(tab === 'grades') document.querySelectorAll('.s-nav-btn')[1].classList.add('active');

            const container = document.getElementById('studentContent');
            container.innerHTML = '';

            if (tab === 'schedule') {
                Object.keys(appData.subjects).forEach(subj => {
                    const subjData = appData.subjects[subj];
                    const div = document.createElement('div');
                    div.className = 's-card';
                    
                    let gradesHtml = '';
                    appData.dates.forEach(d => {
                        const key = `${currentUser.id}-${d}`;
                        if (subjData.grades[key]) {
                            const g = subjData.grades[key].grade;
                            gradesHtml += `<div class="s-grade g${g}" onclick="alert('Оценка: ${g}\\nЗа что: ${subjData.grades[key].type}\\nТема: ${subjData.grades[key].theme || 'Не указана'}')">${g}</div>`;
                        }
                    });

                    div.innerHTML = `
                        <div>
                            <div style="font-weight: bold; font-size: 16px; margin-bottom: 5px;">${subj}</div>
                            <div style="font-size: 12px; color: #aaa;">ДЗ: ${subjData.homework || 'Нет'}</div>
                        </div>
                        <div style="display: flex; gap: 5px;">${gradesHtml}</div>
                    `;
                    container.appendChild(div);
                });
            } else if (tab === 'grades') {
                container.innerHTML = '<div style="padding: 20px; text-align: center; color: #8e8e93;">Все оценки отображаются в расписании</div>';
            }
        }
    </script>
</body>
</html>
